<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>礼品册小程序 · 定制预览与开店手册</title>
  <style>
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #64748B;
  --line: rgba(15, 23, 42, 0.08);
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.06);

  --emerald: #059669;
  --emerald-soft: #ECFDF5;
  --gold: #D97706;
  --gold-soft: #FFFBEB;
  --accent: #0F172A;
  --blue: #2563EB;
  --blue-soft: #EFF6FF;

  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-pill: 9999px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

.svg-ic {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.app-shell {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 12px 12px 104px;
}

/* 顶部深色高定定制名片卡 */
.studio-hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-lg);
  padding: 16px;
  background: linear-gradient(145deg, #111827 0%, #1E293B 100%);
  color: #F8FAFC;
  box-shadow: 0 16px 36px -12px rgba(15, 23, 42, 0.35);
  margin-bottom: 10px;
}

.studio-hero::after {
  content: "";
  position: absolute;
  top: -40px;
  right: -40px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, transparent 70%);
  pointer-events: none;
}

.studio-hero__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.studio-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--r-pill);
  background: rgba(16, 185, 129, 0.16);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #6EE7B7;
  font-size: 14px;
  font-weight: 600;
}

.studio-pill__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34D399;
}

.share-card-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  border: 1px solid rgba(251, 191, 36, 0.45);
  background: rgba(251, 191, 36, 0.12);
  color: #FDE68A;
  font-size: 14px;
  font-weight: 700;
}

.studio-hero__title {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.studio-hero__sub {
  margin: 0;
  font-size: 15px;
  color: #CBD5E1;
}

/* 紧凑三栏合作明白卡 */
.clarity-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.clarity-col {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.clarity-col__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.clarity-col__num {
  font-size: 14px;
  font-weight: 800;
  color: var(--emerald);
}

.clarity-col__title {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.clarity-col__line {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.25;
}

.clarity-col__desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.35;
}

.section-panel[hidden] {
  display: none;
}

/* 实机控制栏 */
.sim-toolbar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}

.seg-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: var(--r-md);
  background: #E2E8F0;
}

.seg-btn {
  min-height: 44px;
  border: none;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 700;
  transition: all 0.16s ease;
}

.seg-btn.is-active {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
}

.util-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.currency-pills {
  display: flex;
  gap: 6px;
}

.currency-pill {
  min-height: 36px;
  padding: 4px 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.currency-pill.is-active {
  background: var(--ink);
  color: #FFFFFF;
  border-color: var(--ink);
}

.ghost-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 36px;
  padding: 4px 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
}

/* 逼真微信小程序模拟器 */
.phone-frame {
  position: relative;
  width: 100%;
  background: #F8FAFC;
  border: 1px solid rgba(15, 23, 42, 0.12);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 20px 44px -16px rgba(15, 23, 42, 0.18);
  display: flex;
  flex-direction: column;
  height: 610px;
}

.wx-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.wx-topbar__left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.wx-brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--ink);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
}

.wx-topbar__title {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
}

.wx-capsule {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 11px;
  border-radius: var(--r-pill);
  border: 1px solid rgba(15, 23, 42, 0.12);
  background: rgba(255, 255, 255, 0.9);
  font-size: 14px;
  color: var(--ink);
}

.wx-capsule__sep {
  width: 1px;
  height: 13px;
  background: rgba(15, 23, 42, 0.16);
}

.phone-mode-strip {
  padding: 7px 14px;
  font-size: 14px;
  font-weight: 700;
  background: #F1F5F9;
  color: var(--ink-2);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.phone-mode-strip.is-owner {
  background: #0F172A;
  color: #E2E8F0;
}

.owner-nav-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 8px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.owner-nav-bar[hidden] {
  display: none;
}

.owner-nav__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 44px;
  padding: 6px 4px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: #F8FAFC;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
}

.owner-nav__btn.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #FFFFFF;
}

.phone-screen {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.wx-tabbar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px 4px;
  flex-shrink: 0;
}

.wx-tabbar[hidden] {
  display: none;
}

.wx-tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 48px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  position: relative;
}

.wx-tabbar__item.is-active {
  color: var(--ink);
  font-weight: 800;
}

.wx-tabbar__badge {
  position: absolute;
  top: 2px;
  right: 14px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background: var(--emerald);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}

/* 手机内部精致卡片 */
.m-trio-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.m-trio-cell {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px;
}

.m-trio-cell__lbl {
  display: block;
  font-size: 14px;
  font-weight: 800;
  color: var(--emerald);
}

.m-trio-cell__tx {
  display: block;
  font-size: 14px;
  color: var(--ink-2);
  margin-top: 2px;
  line-height: 1.3;
}

.m-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.04);
}

.m-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.m-card__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}

.m-card__meta {
  font-size: 14px;
  color: var(--muted);
}

.m-entry-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.m-entry-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-height: 58px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #F8FAFC;
  text-align: left;
}

.m-entry-btn strong {
  font-size: 15px;
  color: var(--ink);
}

.m-entry-btn span {
  font-size: 14px;
  color: var(--muted);
}

/* 精美电商感商品卡片 */
.m-gift-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.m-gift-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.m-gift-card__top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.m-gift-illus {
  width: 72px;
  height: 72px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.m-gift-card__name {
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}

.m-gift-card__sub {
  font-size: 14px;
  color: var(--muted);
  margin-top: 2px;
}

.m-gift-card__price {
  display: inline-block;
  margin-top: 4px;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  background: var(--emerald-soft);
  color: var(--emerald);
  font-size: 14px;
  font-weight: 800;
}

.m-gift-card__actions {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

.m-chip-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.m-chip {
  flex-shrink: 0;
  min-height: 38px;
  padding: 6px 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
}

.m-chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #FFFFFF;
}

/* 按钮与表单 */
.m-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
}

.m-btn--dark {
  background: var(--ink);
  border-color: var(--ink);
  color: #FFFFFF;
}

.m-btn--emerald {
  background: var(--emerald);
  border-color: var(--emerald);
  color: #FFFFFF;
}

.m-btn--block {
  width: 100%;
}

.m-btn--sm {
  min-height: 38px;
  padding: 5px 12px;
  font-size: 14px;
}

.m-input, .m-textarea {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  border: 1px solid rgba(15, 23, 42, 0.14);
  background: #F8FAFC;
  font-size: 15px;
}

.m-textarea {
  min-height: 68px;
  resize: vertical;
}

.m-form-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
}

.m-form-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-2);
}

.m-row-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.m-list-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
}

.m-list-item__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.m-status-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 700;
}

.m-status-tag--pending {
  background: var(--gold-soft);
  color: var(--gold);
}

.m-status-tag--done {
  background: var(--emerald-soft);
  color: var(--emerald);
}

.m-address-box {
  margin: 8px 0;
  padding: 10px;
  border-radius: var(--r-sm);
  background: #F8FAFC;
  font-size: 15px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.m-inline-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.phone-modal-mask {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(15, 23, 42, 0.48);
  display: flex;
  align-items: flex-end;
}

.phone-modal-mask[hidden] {
  display: none;
}

.phone-modal-sheet {
  width: 100%;
  max-height: 82%;
  overflow-y: auto;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 16px;
}

.text-btn {
  border: none;
  background: transparent;
  color: var(--blue);
  font-size: 14px;
  font-weight: 700;
  padding: 4px 0;
}

.sim-footnote {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 14px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* 02 注册与过审：手风琴步骤卡 */
.section-head-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.section-head-card__title {
  margin: 0 0 4px;
  font-size: 20px;
  font-weight: 800;
}

.section-head-card__desc {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}

.progress-track {
  margin-top: 10px;
  height: 8px;
  border-radius: var(--r-pill);
  background: #E2E8F0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--emerald);
  border-radius: var(--r-pill);
  transition: width 0.25s ease;
}

.accordion-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.acc-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.acc-card.is-completed {
  border-color: rgba(5, 150, 105, 0.35);
}

.acc-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px;
  border: none;
  background: transparent;
  text-align: left;
  min-height: 60px;
}

.acc-head__left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.acc-num {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--ink);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.acc-card.is-completed .acc-num {
  background: var(--emerald);
}

.acc-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}

.acc-badge {
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
}

.acc-body {
  padding: 0 14px 14px;
  border-top: 1px solid var(--line);
}

.acc-body[hidden] {
  display: none;
}

.path-box {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 14px;
  font-weight: 700;
}

.step-bullets {
  margin: 10px 0;
  padding-left: 20px;
  font-size: 16px;
  color: var(--ink-2);
}

.step-bullets li {
  margin-bottom: 5px;
}

.pitfall-box {
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--gold-soft);
  color: #92400E;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 10px;
}

.acc-actions {
  display: flex;
  gap: 8px;
}

/* 03 后台怎么用：紧凑直连卡 */
.backend-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.backend-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.backend-card__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.backend-card__title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.backend-card__ic {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #F1F5F9;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.backend-card__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
}

.backend-card__path {
  font-size: 14px;
  color: var(--muted);
}

.backend-try-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: var(--r-pill);
  border: none;
  background: var(--ink);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}

/* 底部常驻毛玻璃拇指导航栏 (Bottom Dock) */
.bottom-dock {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 496px;
  z-index: 45;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 6px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(15, 23, 42, 0.1);
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
}

.dock-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 52px;
  border: none;
  border-radius: 16px;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  transition: all 0.16s ease;
}

.dock-btn__num {
  font-size: 14px;
  font-weight: 800;
  opacity: 0.7;
}

.dock-btn.is-active {
  background: var(--ink);
  color: #FFFFFF;
}

.dock-btn.is-active .dock-btn__num {
  color: #6EE7B7;
  opacity: 1;
}

/* 黑金定制名片浮层 */
.poster-modal-mask {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(15, 23, 42, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.poster-modal-mask[hidden] {
  display: none;
}

.poster-modal-wrap {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.poster-card {
  background: linear-gradient(155deg, #111827 0%, #1E293B 100%);
  border: 1px solid rgba(251, 191, 36, 0.45);
  border-radius: 24px;
  padding: 20px 18px;
  color: #F8FAFC;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
}

.poster-card__kicker {
  display: inline-block;
  padding: 4px 12px;
  border-radius: var(--r-pill);
  background: rgba(251, 191, 36, 0.15);
  border: 1px solid rgba(251, 191, 36, 0.4);
  color: #FDE68A;
  font-size: 14px;
  font-weight: 700;
}

.poster-card__title {
  margin: 12px 0 4px;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.25;
}

.poster-card__sub {
  margin: 0 0 14px;
  font-size: 15px;
  color: #6EE7B7;
  font-weight: 600;
}

.poster-trio {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.poster-trio-item {
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.poster-trio-item strong {
  display: block;
  font-size: 16px;
  color: #FDE68A;
}

.poster-trio-item span {
  display: block;
  font-size: 15px;
  color: #E2E8F0;
  margin-top: 2px;
}

.poster-card__foot {
  text-align: center;
  font-size: 14px;
  color: #94A3B8;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}

.poster-modal-tip {
  text-align: center;
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 700;
}

/* 对比与点播浮层内表格 */
.compare-row {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px;
  margin-bottom: 8px;
}

.compare-row__cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 14px;
  margin-top: 4px;
}

.compare-col--market {
  background: #F1F5F9;
  color: var(--muted);
  padding: 6px 8px;
  border-radius: 8px;
}

.compare-col--ours {
  background: var(--emerald-soft);
  color: var(--emerald);
  font-weight: 700;
  padding: 6px 8px;
  border-radius: 8px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%);
  z-index: 70;
  max-width: 90vw;
  padding: 10px 18px;
  border-radius: var(--r-pill);
  background: rgba(15, 23, 42, 0.94);
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
}

.toast[hidden] {
  display: none;
}

/* ── 4 套 UI 风格与版式选择器 ── */
.theme-picker-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.theme-picker-card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.theme-picker-card__title {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
}

.theme-picker-card__sub {
  font-size: 14px;
  color: var(--muted);
}

.theme-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.theme-tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 10px;
  border-radius: var(--r-sm);
  border: 2px solid var(--line);
  background: #F8FAFC;
  text-align: left;
  transition: all 0.16s ease;
}

.theme-tile.is-active {
  background: var(--card);
  border-color: var(--ink);
  box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.18);
}

.theme-tile__top {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.theme-tile__code {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.theme-swatches {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.theme-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(15, 23, 42, 0.15);
}

.theme-tile__sub {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  line-height: 1.3;
}

.theme-tile__for {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.3;
}

/* ── 顶部工作室头卡按所选主题联动辉光 ── */
.studio-hero[data-ui-theme="crimson"] {
  background: linear-gradient(145deg, #450A0A 0%, #7F1D1D 100%);
}
.studio-hero[data-ui-theme="tea"] {
  background: linear-gradient(145deg, #3E2723 0%, #5D4037 100%);
}
.studio-hero[data-ui-theme="glacier"] {
  background: linear-gradient(145deg, #0F172A 0%, #1E3A8A 100%);
}

/* ── 4 套主题色彩变量覆盖（作用在 #phone-frame） ── */
.phone-frame[data-ui-theme="obsidian"] {
  --p-bg: #F8FAFC;
  --p-card: #FFFFFF;
  --p-topbar: #111827;
  --p-topbar-ink: #F8FAFC;
  --p-primary: #111827;
  --p-accent: #059669;
  --p-accent-soft: #ECFDF5;
  --p-vip-bg: linear-gradient(135deg, #111827 0%, #1F2937 100%);
  --p-vip-ink: #FDE68A;
  --p-radius: 16px;
}

.phone-frame[data-ui-theme="crimson"] {
  --p-bg: #FFF7F5;
  --p-card: #FFFFFF;
  --p-topbar: linear-gradient(90deg, #DC2626 0%, #991B1B 100%);
  --p-topbar-ink: #FFFFFF;
  --p-primary: #DC2626;
  --p-accent: #D97706;
  --p-accent-soft: #FEF3C7;
  --p-vip-bg: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
  --p-vip-ink: #FEF08A;
  --p-radius: 18px;
}

.phone-frame[data-ui-theme="tea"] {
  --p-bg: #FAF6F0;
  --p-card: #FFFDF9;
  --p-topbar: #FAF6F0;
  --p-topbar-ink: #4A2C18;
  --p-primary: #8C4A27;
  --p-accent: #3F6212;
  --p-accent-soft: #ECFCCB;
  --p-vip-bg: linear-gradient(135deg, #F3EAE0 0%, #E7D8C9 100%);
  --p-vip-ink: #4A2C18;
  --p-radius: 12px;
}

.phone-frame[data-ui-theme="glacier"] {
  --p-bg: #F0F7FF;
  --p-card: #FFFFFF;
  --p-topbar: #2563EB;
  --p-topbar-ink: #FFFFFF;
  --p-primary: #2563EB;
  --p-accent: #1D4ED8;
  --p-accent-soft: #DBEAFE;
  --p-vip-bg: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
  --p-vip-ink: #FFFFFF;
  --p-radius: 10px;
}

.phone-frame[data-ui-theme] {
  background: var(--p-bg);
}

.phone-frame[data-ui-theme] .phone-screen {
  background: var(--p-bg);
}

.phone-frame[data-ui-theme] .wx-topbar {
  background: var(--p-topbar);
  color: var(--p-topbar-ink);
  border-bottom-color: rgba(15, 23, 42, 0.08);
}

.phone-frame[data-ui-theme] .wx-topbar__title {
  color: var(--p-topbar-ink);
}

.phone-frame[data-ui-theme] .wx-brand-mark {
  background: var(--p-accent);
  color: #FFFFFF;
}

.phone-frame[data-ui-theme] .m-vip-card {
  background: var(--p-vip-bg);
  color: var(--p-vip-ink);
  border-radius: var(--p-radius);
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid rgba(15, 23, 42, 0.08);
}

.phone-frame[data-ui-theme] .m-btn--emerald {
  background: var(--p-primary);
  border-color: var(--p-primary);
}

.phone-frame[data-ui-theme] .m-gift-card__price {
  background: var(--p-accent-soft);
  color: var(--p-accent);
}

/* ── 4 种截然不同的商品排版模式（data-layout-mode） ── */
/* A: 双列精品画廊 */
.phone-frame[data-layout-mode="gallery"] .m-gift-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.phone-frame[data-layout-mode="gallery"] .m-gift-card {
  border-radius: var(--p-radius);
  padding: 10px;
}
.phone-frame[data-layout-mode="gallery"] .m-gift-card__top {
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}
.phone-frame[data-layout-mode="gallery"] .m-gift-illus {
  width: 100%;
  height: 82px;
}
.phone-frame[data-layout-mode="gallery"] .m-gift-card__actions {
  grid-template-columns: 1fr;
}

/* B: 朱砂喜庆大横幅抢兑版 */
.phone-frame[data-layout-mode="banner"] .m-gift-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.phone-frame[data-layout-mode="banner"] .m-gift-card {
  border: 2px solid rgba(220, 38, 38, 0.25);
  border-radius: var(--p-radius);
  padding: 12px;
}
.phone-frame[data-layout-mode="banner"] .m-gift-card__actions {
  grid-template-columns: 1fr auto;
}

/* C: 温润茶白纸质礼册横排版（左图右文） */
.phone-frame[data-layout-mode="editorial"] .m-gift-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.phone-frame[data-layout-mode="editorial"] .m-gift-card {
  border-left: 4px solid #8C4A27;
  border-radius: var(--p-radius);
  background: #FFFDF9;
}
.phone-frame[data-layout-mode="editorial"] .m-gift-illus {
  width: 84px;
  height: 84px;
}

/* D: 冰川科技紧凑数字看板版 */
.phone-frame[data-layout-mode="compact"] .m-gift-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.phone-frame[data-layout-mode="compact"] .m-gift-card {
  padding: 8px;
  border-radius: var(--p-radius);
  border-color: rgba(37, 99, 235, 0.2);
}
.phone-frame[data-layout-mode="compact"] .m-gift-card__top {
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.phone-frame[data-layout-mode="compact"] .m-gift-illus {
  width: 100%;
  height: 58px;
}
.phone-frame[data-layout-mode="compact"] .m-gift-card__actions {
  grid-template-columns: 1fr;
}

/* 自定义店名与积分名实时输入栏 */
.custom-brand-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.custom-brand-input {
  width: 100%;
  min-height: 40px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
}

.custom-brand-input:focus {
  outline: 2px solid var(--blue);
  outline-offset: -1px;
}

/* =====================================================================
   第 7 轮：4 套完全独立的 UI 骨架样式（A 曜石黑金 / B 朱砂喜庆 / C 温润茶白 / D 冰川科技）
   ===================================================================== */

/* ── 版本 A：曜石黑金（尊享黑卡 + 2x2 专柜画廊 + 悬浮黑金底栏） ── */
.obs-vip-card {
  background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 18px;
  padding: 14px;
  color: #F8FAFC;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px -8px rgba(15, 23, 42, 0.35);
}

.obs-vip-card__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.obs-vip-card__num {
  font-size: 26px;
  font-weight: 900;
  color: #FDE68A;
  line-height: 1.15;
}

.obs-vip-card__acts {
  display: flex;
  gap: 6px;
}

.obs-pill-btn {
  min-height: 34px;
  padding: 4px 10px;
  border-radius: 9999px;
  border: 1px solid rgba(212, 175, 55, 0.5);
  background: rgba(212, 175, 55, 0.14);
  color: #FDE68A;
  font-size: 14px;
  font-weight: 700;
}

.obs-vip-card__foot {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(212, 175, 55, 0.22);
  font-size: 14px;
  color: #CBD5E1;
  letter-spacing: 0.03em;
}

.obs-cat-rail {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 8px;
}

.obs-cat-pill {
  flex-shrink: 0;
  min-height: 36px;
  padding: 5px 12px;
  border-radius: 9999px;
  border: 1px solid rgba(15, 23, 42, 0.15);
  background: #FFFFFF;
  color: #334155;
  font-size: 14px;
  font-weight: 700;
}

.obs-cat-pill.is-active {
  background: #0F172A;
  border-color: #D4AF37;
  color: #FDE68A;
}

.obs-gallery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.obs-gift-card {
  background: #FFFFFF;
  border: 1px solid rgba(15, 23, 42, 0.1);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.08);
}

.obs-gift-stage {
  position: relative;
  height: 92px;
  background: linear-gradient(145deg, #111827 0%, #1E293B 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.obs-gift-badge {
  position: absolute;
  top: 6px;
  left: 6px;
  padding: 2px 8px;
  border-radius: 9999px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(212, 175, 55, 0.65);
  color: #FDE68A;
  font-size: 14px;
  font-weight: 800;
}

.obs-gift-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.obs-gift-name {
  font-size: 15px;
  font-weight: 800;
  color: #0F172A;
  line-height: 1.3;
}

.obs-gold-btn {
  margin-top: auto;
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1.5px solid #B48A1E;
  background: #FFFDF7;
  color: #855E08;
  font-size: 14px;
  font-weight: 800;
}

.wx-tabbar.wx-tabbar--obsidian {
  margin: 0 10px 10px;
  border-radius: 9999px;
  background: #0F172A;
  border: 1px solid rgba(212, 175, 55, 0.35);
  padding: 4px 8px;
}
.wx-tabbar.wx-tabbar--obsidian .wx-tabbar__item { color: #94A3B8; }
.wx-tabbar.wx-tabbar--obsidian .wx-tabbar__item.is-active { color: #FDE68A; }

/* ── 版本 B：朱砂喜庆（弧形红金头图 + 金色福袋 + 通栏爆款大横幅） ── */
.cri-curved-hero {
  background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
  border-radius: 16px 16px 28px 28px;
  padding: 14px;
  color: #FFFFFF;
  margin-bottom: 10px;
  box-shadow: 0 10px 22px -8px rgba(220, 38, 38, 0.45);
}

.cri-curved-hero__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.cri-curved-hero__title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
  color: #FEF08A;
}

.cri-rule-circle {
  min-width: 48px;
  min-height: 36px;
  padding: 4px 10px;
  border-radius: 9999px;
  border: 1.5px solid #FDE68A;

  color: #FEF08A;
  font-size: 14px;
  font-weight: 800;
}

.cri-steps-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  margin-top: 10px;
  padding: 6px 10px;

  background: rgba(0, 0, 0, 0.16);
  font-size: 14px;
  font-weight: 700;
  color: #FEF9C3;

.cri-bag-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;

.cri-bag-bar__val {

.cri-bag-btn {

  padding: 4px 12px;

.cri-banner-card {

.cri-banner-tag {

.cri-banner-illus {

.cri-banner-info {

.cri-banner-name {

.cri-banner-cost {

.cri-prog-wrap {

}

.cri-prog-track {

  height: 6px;
  border-radius: 9999px;
  background: #FEE2E2;
  overflow: hidden;
}

.cri-prog-fill {
  height: 100%;
  background: linear-gradient(90deg, #F59E0B, #DC2626);
}

.cri-grab-btn {
  min-height: 40px;
  padding: 6px 12px;

  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.hidden = true;
    }, 2400);
  }

  function copyText(text, okMsg) {
    var val = String(text || '');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(function () {
        showToast(okMsg || '已复制');
      }).catch(function () {
        fallbackCopy(val, okMsg);
      });
    } else {
      fallbackCopy(val, okMsg);
    }
  }

  function fallbackCopy(val, okMsg) {
    try {
      var ta = document.createElement('textarea');
      ta.value = val;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(okMsg || '已复制');
    } catch (e) {
      showToast('请长按复制：' + val);
    }
  }

      '<strong style="font-size:19px;color:var(--ink);">' + esc(g.name) + '</strong>' +

    );

    var sheet = document.getElementById('phone-modal-sheet');
    if (sheet) {
      sheet.querySelectorAll('[data-spec-val]').forEach(function (btn) {
        btn.addEventListener('click', function () {

          sheet.querySelectorAll('[data-spec-val]').forEach(function (b) {
            b.classList.toggle('is-active', b === btn);
          });
        });
      });
    }

    if (redeemBtn) {
      redeemBtn.addEventListener('click', function () {
        if (cust.balance < g.cost) {
          showToast('当前演示余额不足，可切到店主后台给客户充值');
          return;
        }
        cust.balance -= g.cost;
        state.applies.unshift({
          id: 'ord-demo-' + (103 + state.applies.length),
          giftId: g.id,
          giftName: g.name + '（' + activeSpec + '）',
          cost: g.cost,
          status: 'pending',
          statusLabel: '待发货',
          isNew: true,
          receiver: state.applyFormReceiver,
          phone: state.applyFormPhone,
          address: state.applyFormAddress,
          expressCompany: '',
          trackingNo: '',
          createdAt: '刚刚',
        });
        state.logs.unshift({
          id: 'log-' + Date.now(),
          customerCode: cust.code,
          customerName: cust.nickname,
          delta: -g.cost,
          balanceAfter: cust.balance,
          reason: '兑换 ' + g.name,
          time: '刚刚',
        });
        closePhoneModal();
        renderPhone();
        showToast('兑换成功！切到「店主手机后台 → 发货」可立即看到这笔新订单');

  function renderCustomerScreen() {
    var screen = document.getElementById('phone-screen');
    if (!screen) return;
    var cs = bundle.previewData.customerScreens;
    var cust = currentCustomer();
    var u = unit();

    if (state.customerTab === 'home') {
      var themeId = currentUiTheme().id;
      if (themeId === 'crimson') return renderCustomerHomeCrimson(screen, cs, cust, u);
      if (themeId === 'tea') return renderCustomerHomeTea(screen, cs, cust, u);
      if (themeId === 'glacier') return renderCustomerHomeGlacier(screen, cs, cust, u);
      return renderCustomerHomeObsidian(screen, cs, cust, u);
    }

    if (state.customerTab === 'category') {
      var filtered = state.gifts.filter(function (g) {
        var catOk = state.selectedCategory === '全部' || g.category === state.selectedCategory;
        var costOk = true;
        if (state.selectedCostFilter === 'low') costOk = g.cost <= 30;
        if (state.selectedCostFilter === 'mid') costOk = g.cost > 30 && g.cost <= 80;
        if (state.selectedCostFilter === 'high') costOk = g.cost > 80;
        return catOk && costOk;
      });
      screen.innerHTML =
        '<div class="m-chip-row">' +
          cs.categories.map(function (cat) {
            return '<button type="button" class="m-chip ' + (state.selectedCategory === cat ? 'is-active' : '') + '" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="m-chip-row">' +
          cs.costFilters.map(function (cf) {
            return '<button type="button" class="m-chip ' + (state.selectedCostFilter === cf.key ? 'is-active' : '') + '" data-cost="' + esc(cf.key) + '">' + esc(cf.label) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="m-gift-grid">' +
          (filtered.length ? filtered.map(renderCustomerGiftCard).join('') : '<div class="m-card" style="text-align:center;">暂无匹配礼品</div>') +
        '</div>';

      screen.querySelectorAll('[data-cat]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.selectedCategory = btn.getAttribute('data-cat');
          renderCustomerScreen();
        });
      });
      screen.querySelectorAll('[data-cost]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.selectedCostFilter = btn.getAttribute('data-cost');
          renderCustomerScreen();
        });
      });
      bindGiftCardActions(screen);
      return;
    }

    if (state.customerTab === 'wishlist') {
      var wishGifts = state.wishlistIds.map(findGift).filter(Boolean);
      var totalCost = wishGifts.reduce(function (sum, g) { return sum + Number(g.cost || 0); }, 0);
      screen.innerHTML =
        '<div class="m-card">' +
          '<p class="m-card__title">我的礼栈（' + wishGifts.length + ' 件）</p>' +
          '<p class="m-card__meta" style="margin:6px 0 0;">合计需 <strong style="color:var(--gold)">' + totalCost + ' ' + esc(u) + '</strong> · 可用 <strong style="color:var(--emerald)">' + cust.balance + ' ' + esc(u) + '</strong></p>' +
        '</div>' +
        '<div class="m-row-list">' +

              (shipped ? '<div class="m-card__meta" style="color:var(--emerald);font-weight:700;margin-top:4px;">单号：' + esc(a.expressCompany + ' ' + a.trackingNo) + '</div>' : '') +

      if (subBtn) {
        subBtn.addEventListener('click', function () {

          var receiver = document.getElementById('c-apply-name').value.trim();
          var phone = document.getElementById('c-apply-phone').value.trim();
          var address = document.getElementById('c-apply-addr').value.trim();
          if (!gift || !receiver || !phone || !address) {
            showToast('请填完整收货信息');
            return;
          }
          if (cust.balance < gift.cost) {
            showToast('余额不足，可切到店主后台加币');
            return;
          }
          cust.balance -= gift.cost;
          state.applies.unshift({
            id: 'ord-demo-' + (103 + state.applies.length),
            giftId: gift.id,
            giftName: gift.name,
            cost: gift.cost,
            status: 'pending',
            statusLabel: '待发货',
            receiver: receiver,
            phone: phone,
            address: address,
            expressCompany: '',
            trackingNo: '',
            createdAt: '刚刚',

            id: 'log-' + Date.now(),

            customerName: cust.nickname,
            delta: -gift.cost,
            balanceAfter: cust.balance,
            reason: '兑换' + gift.name,
            time: '刚刚',
          });
          renderPhone();
          showToast('已提交！切到「店主手机后台 → 待发货」可直接处理');

          state.customers.map(function (c) {
            return '<div class="m-list-item">' +
              '<div class="m-list-item__top">' +
                '<strong style="font-size:16px;">' + esc(c.nickname) + ' (#' + esc(c.code) + ')</strong>' +
                '<strong style="font-size:17px;color:var(--emerald);">' + c.balance + ' ' + esc(u) + '</strong>' +
              '</div>' +
              '<div class="m-inline-edit">' +
                '<button type="button" class="m-btn m-btn--sm" style="flex:1;" data-adj="-10" data-ccode="' + esc(c.code) + '">-10</button>' +
                '<button type="button" class="m-btn m-btn--sm m-btn--emerald" style="flex:1;" data-adj="10" data-ccode="' + esc(c.code) + '">+10 发币</button>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="m-card" style="margin-top:10px;">' +
          '<p class="m-card__title" style="margin-bottom:8px;">实时总流水</p>' +
          state.logs.slice(0, 5).map(function (lg) {
            var plus = lg.delta >= 0;
            return '<div class="m-list-item__top" style="padding:6px 0;border-top:1px solid var(--line);font-size:14px;">' +
              '<span>' + esc(lg.customerName) + ' · ' + esc(formatTerms(lg.reason)) + '</span>' +
              '<strong style="color:' + (plus ? 'var(--emerald)' : 'var(--gold)') + ';">' + (plus ? '+' : '') + lg.delta + '</strong>' +
            '</div>';
          }).join('') +
        '</div>';

      screen.querySelectorAll('[data-adj]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var code = btn.getAttribute('data-ccode');
          var delta = parseInt(btn.getAttribute('data-adj'), 10);
          for (var i = 0; i < state.customers.length; i++) {
            var c = state.customers[i];
            if (c.code === code) {
              if (c.balance + delta < 0) {
                showToast('余额不能为负');
                return;
              }
              c.balance += delta;
              state.logs.unshift({
                id: 'log-' + Date.now(),
                customerCode: c.code,
                customerName: c.nickname,
                delta: delta,
                balanceAfter: c.balance,
                reason: delta > 0 ? '店主发币' : '店主扣减',
                time: '刚刚',
              });
              renderOwnerScreen();
              showToast('已调整并写入流水');
              break;
            }
          }
        });
      });
      bindBossGuide(screen);
    }
  }

  /* ── 02 注册与过审（手风琴折叠 + 自动展开下一步） ── */
  function renderAuditTutorial() {
    var steps = (bundle.auditTutorial && bundle.auditTutorial.steps) || [];
    var total = steps.length;
    var doneCount = steps.filter(function (s) { return state.auditCompleted.indexOf(s.id) >= 0; }).length;
    var pct = total ? Math.round((doneCount / total) * 100) : 0;

    var progText = document.getElementById('audit-progress-text');
    var progFill = document.getElementById('audit-progress-fill');
    if (progText) progText.textContent = '已完成 ' + doneCount + ' / ' + total + ' 步 · 点击展开详情';
    if (progFill) progFill.style.width = pct + '%';

    var container = document.getElementById('audit-steps-list');
    if (!container) return;

    container.innerHTML = steps.map(function (st) {
      var done = state.auditCompleted.indexOf(st.id) >= 0;
      var expanded = state.auditOpenId === st.id;
      return '<article class="acc-card ' + (done ? 'is-completed' : '') + '">' +
        '<button type="button" class="acc-head" data-acc-toggle="' + esc(st.id) + '" aria-expanded="' + expanded + '">' +
          '<div class="acc-head__left">' +
            '<span class="acc-num">' + (done ? svgIcon('check', 16) : esc(st.stepNum || ('0' + st.stepNo))) + '</span>' +
            '<div>' +
              '<div class="acc-title">' + esc(st.title) + '</div>' +
              '<div class="acc-badge">' + esc(st.badge) + (done ? ' · 已完成' : '') + '</div>' +
            '</div>' +
          '</div>' +
          svgIcon('chevron', 18) +
        '</button>' +
        '<div class="acc-body" ' + (expanded ? '' : 'hidden') + '>' +
          '<div class="path-box">去哪里点：' + esc(st.wherePath) + '</div>' +
          '<ul class="step-bullets">' +
            (st.bigSteps || []).map(function (bs) { return '<li>' + esc(bs) + '</li>'; }).join('') +
          '</ul>' +
          (st.oneLineWarning ? '<div class="pitfall-box">' + esc(st.oneLineWarning) + '</div>' : '') +
          '<div class="acc-actions">' +
            '<button type="button" class="m-btn ' + (done ? 'm-btn--emerald' : 'm-btn--dark') + '" style="flex:1;" data-toggle-audit="' + esc(st.id) + '">' +
              (done ? '已完成（点此取消）' : '完成这一步') +
            '</button>' +
            '<button type="button" class="m-btn" data-copy-audit="' + esc(st.id) + '">' + svgIcon('copy', 15) + '复制</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');

    container.querySelectorAll('[data-acc-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-acc-toggle');
        state.auditOpenId = state.auditOpenId === id ? '' : id;
        renderAuditTutorial();
      });
    });

    container.querySelectorAll('[data-toggle-audit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-toggle-audit');
        var idx = state.auditCompleted.indexOf(id);
        if (idx >= 0) {
          state.auditCompleted.splice(idx, 1);
        } else {
          state.auditCompleted.push(id);
          // 自动展开下一步
          for (var i = 0; i < steps.length - 1; i++) {
            if (steps[i].id === id) {
              state.auditOpenId = steps[i + 1].id;
              break;
            }
          }
        }
        saveCompletedSteps();
        renderAuditTutorial();
      });
    });

    container.querySelectorAll('[data-copy-audit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-copy-audit');
        for (var i = 0; i < steps.length; i++) {
          if (steps[i].id === id) {
            copyText(steps[i].copySummary || steps[i].title, '已复制第 ' + steps[i].stepNo + ' 步要点');
            break;
          }
        }
      });
    });
  }

  /* ── 03 后台怎么用（紧凑直连卡） ── */
  function renderBackendTutorial() {
    var steps = (bundle.backendTutorial && bundle.backendTutorial.steps) || [];
    var container = document.getElementById('backend-steps-list');
    if (!container) return;

    container.innerHTML = steps.map(function (st) {
      var target = st.previewTarget || { role: 'owner', tab: 'applies' };
      return '<article class="backend-card">' +
        '<div class="backend-card__top">' +
          '<div class="backend-card__title-wrap">' +
            '<span class="backend-card__ic">' + svgIcon(st.iconKey, 18) + '</span>' +
            '<div>' +
              '<h3 class="backend-card__title">' + esc(st.title) + '</h3>' +
              '<span class="backend-card__path">' + esc(st.entryPath) + '</span>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="backend-try-btn" data-jump-tab="' + esc(target.tab) + '">去实机试一下 →</button>' +
        '</div>' +
        '<ul class="step-bullets" style="margin:0;">' +
          (st.bigSteps || []).map(function (bs) { return '<li>' + esc(formatTerms(bs)) + '</li>'; }).join('') +
        '</ul>' +
      '</article>';
    }).join('');

    container.querySelectorAll('[data-jump-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.perspective = 'owner';
        state.ownerTab = btn.getAttribute('data-jump-tab') || 'applies';
        switchSection('preview');
        renderAll();
        var frame = document.getElementById('phone-frame');
        if (frame && frame.scrollIntoView) {
          frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        showToast('已切到对应手机后台，可直接试用');
      });
    });
  }

  /* ── 浮层 1：高定黑金微信分享名片 ── */
  function openPosterModal() {
    var mask = document.getElementById('poster-modal-mask');
    var body = document.getElementById('poster-card-body');
    var tip = document.getElementById('poster-modal-tip');
    var pc = (bundle.marketingData && bundle.marketingData.posterCard) || {};
    if (!mask || !body) return;
    if (tip) tip.textContent = '手机截屏上方名片，即可直接发进微信聊天';
    body.innerHTML =
      '<span class="poster-card__kicker">微信口碑定制 · 零风险试错</span>' +
      '<h2 class="poster-card__title">' + esc(pc.headline || '专属礼品册小程序定制') + '</h2>' +
      '<p class="poster-card__sub">' + esc(pc.subline || '想要功能随便提 · 随时改到满意 · 不满意不要钱') + '</p>' +
      '<div class="poster-trio">' +
        (pc.trio || []).map(function (item) {
          return '<div class="poster-trio-item">' +
            '<strong>' + esc((item.num || '') + ' · ' + item.title) + '</strong>' +
            '<span>' + esc(item.text) + '</span>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div class="poster-card__foot">' + esc(pc.footerNote || '长按或截屏转发微信朋友') + '</div>';
    mask.hidden = false;
  }

  /* ── 浮层 2：定制功能点播与对比 ── */
  function openCustomModal() {
    var mask = document.getElementById('poster-modal-mask');
    var body = document.getElementById('poster-card-body');
    var tip = document.getElementById('poster-modal-tip');
    var md = bundle.marketingData || {};
    if (!mask || !body) return;
    if (tip) tip.textContent = '想要什么功能都可以提，随时改到满意为止';
    body.style.background = '#FFFFFF';
    body.style.color = '#0F172A';
    body.style.borderColor = '#E2E8F0';
    body.innerHTML =
      '<h2 class="poster-card__title" style="margin-top:0;font-size:20px;">为什么选择 1 对 1 口碑定制</h2>' +
      '<div style="margin-bottom:12px;">' +
        (md.comparisonTable || []).map(function (r) {
          return '<div class="compare-row">' +
            '<strong style="font-size:15px;">' + esc(r.dimension) + '</strong>' +
            '<div class="compare-row__cols">' +
              '<div class="compare-col--market">普通模板：' + esc(r.market) + '</div>' +
              '<div class="compare-col--ours">我们：' + esc(r.ours) + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:8px;">常见可加功能示例</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
        (md.customFeatureExamples || []).map(function (f) {
          return '<div style="padding:8px;border-radius:10px;background:#F8FAFC;border:1px solid #E2E8F0;font-size:14px;">' +
            '<strong>' + esc(f.tag) + '</strong>' +
            '<div style="color:#64748B;margin-top:2px;">' + esc(f.desc) + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    mask.hidden = false;
  }

  function closePosterModal() {
    var mask = document.getElementById('poster-modal-mask');
    var body = document.getElementById('poster-card-body');
    if (body) {
      body.style.background = '';
      body.style.color = '';
      body.style.borderColor = '';
    }
    if (mask) mask.hidden = true;
  }

  function renderAll() {
    renderHero();
    renderPainVsGain();
    renderThemePicker();
    renderCurrencyPills();
    renderPhone();
    renderConfigurator();
    renderAuditTutorial();
    renderBackendTutorial();
  }

  bindGlobalNav();
  renderAll();

  if (typeof setInterval === 'function') {
    setInterval(function () {
      var tickers = (bundle.previewData.customerScreens.liveTickers) || [];
      if (!tickers.length) return;
      state.tickerIndex = (state.tickerIndex + 1) % tickers.length;
      var bar = document.getElementById('live-ticker-bar');
      if (bar) {
        var spans = bar.querySelectorAll('span');
        if (spans[1]) spans[1].textContent = tickers[state.tickerIndex];
      }
    }, 3500);
  }
})();

</script>
</body>
</html>
